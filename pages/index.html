<!doctype html>
{{> head}}
<html>
  <body hx-boost="true">
    <main class="container" id="main">
      <hgroup>
        <h1>Soli share</h1>
        <p>Split group costs in a <em>pay what you think</em> approach</p>
      </hgroup>
      <form>
        <label>
          Amount
          <input
            type="number"
            name="number"
            placeholder="Amount"
            aria-label="Number"
          />
        </label>
        <button
          hx-post="/share/new"
          hx-target="#main"
          hx-include="#main"
          hx-push-url="true"
        >
          Create soli share
        </button>
      </form>
    </main>
  </body>
</html>
